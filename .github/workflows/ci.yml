name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: src/tictactoe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: src/tictactoe/**/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/tictactoe
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, linux, x64]
    needs: build

    steps:
      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/tictactoe \
            tictactoe=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/tictactoe --timeout=180s

      - name: Check deployment
        run: |
          kubectl get deployment tictactoe
          kubectl get pods -l app.kubernetes.io/name=tictactoe

      - name: Health check
        run: |
          for i in {1..20}; do
            if kubectl exec deployment/tictactoe -- \
              curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8080/ \
              >/dev/null; then
              echo "Application health check passed"
              exit 0
            fi

            echo "Application is not ready yet. Attempt $i/20"
            sleep 3
          done

          echo "Health check failed"
          kubectl get pods -l app.kubernetes.io/name=tictactoe
          kubectl logs deployment/tictactoe --tail=100
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          kubectl rollout undo deployment/tictactoe
          kubectl rollout status deployment/tictactoe --timeout=180s
