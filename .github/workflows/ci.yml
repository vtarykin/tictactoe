name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: src/tictactoe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: src/tictactoe/**/gradle.wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/tictactoe
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, linux, x64]
    needs: build

    steps:
      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/tictactoe \
            tictactoe=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/tictactoe --timeout=180s

      - name: Show deployment
        run: |
          kubectl get deployment tictactoe
          kubectl get pods -l app.kubernetes.io/name=tictactoe
