name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        working-directory: src/tictactoe
        run: chmod +x ./gradlew

      - name: Run tests
        working-directory: src/tictactoe
        run: ./gradlew test

      - name: Build
        working-directory: src/tictactoe
        run: ./gradlew bootJar
