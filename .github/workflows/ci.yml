name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: src/tictactoe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: src/tictactoe/**/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/tictactoe
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, linux, x64]
    needs: build

    steps:
      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/tictactoe \
            tictactoe=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/tictactoe --timeout=180s

      - name: Check deployment
        run: |
          kubectl get deployment tictactoe
          kubectl get pods -l app.kubernetes.io/name=tictactoe

      - name: Start port-forward
        run: |
          kubectl port-forward service/tictactoe 8080:8080 \
            >/tmp/tictactoe-port-forward.log 2>&1 &

          echo $! >/tmp/tictactoe-port-forward.pid

          sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --silent --show-error --max-time 5 \
              http://127.0.0.1:8080/ \
              >/dev/null; then
              echo "Application is responding"
              exit 0
            fi

            echo "Application is not ready yet. Attempt $i/10"
            sleep 3
          done

          echo "Health check failed"
          cat /tmp/tictactoe-port-forward.log
          exit 1

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f /tmp/tictactoe-port-forward.pid ]; then
            kill "$(cat /tmp/tictactoe-port-forward.pid)" || true
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          kubectl rollout undo deployment/tictactoe
          kubectl rollout status deployment/tictactoe --timeout=180s
